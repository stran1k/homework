<style>

function calc(){var I=+document.getElementById("inc").value||0,E=+document.getElementById("exp").value||0,F=57390+Math.max(0,I-3e5)*.01;
var r=[['УСН «Доходы» 6%',Math.max(0,I*.06-F),F],['УСН «Доходы − расходы» 15%',Math.max(Math.max(0,I-E-F)*.15,I*.01),F],['НПД 4%'+(I>2.4e6?' (лимит превышен!)':''),I*.04,0]];
var m=Math.max.apply(0,r.map(function(x){return x[1]+x[2]}).concat(1)),b=Math.min.apply(0,r.map(function(x){return x[1]+x[2]}));
document.getElementById("res").innerHTML=r.map(function(x){var t=x[1]+x[2];return '<div class="rw"><div class="rl"><span>'+x[0]+(t===b?' ✅':'')+'</span><b>'+fmt(t)+' ₽</b></div><div class="rb"><i style="width:'+x[1]/m*100+'%"></i><u style="width:'+x[2]/m*100+'%"></u></div><small>налог '+fmt(x[1])+' ₽ + взносы '+fmt(x[2])+' ₽</small></div>'}).join('')}
var score=0,done=0;
document.addEventListener("click",function(e){var t=e.target,b=t.closest(".tb");
if(b){var w=b.closest(".tabs"),bs=[].slice.call(w.querySelectorAll(".tb")),ps=w.querySelectorAll(".pn"),k=bs.indexOf(b);bs.forEach(function(x,j){x.classList.toggle("on",j===k);ps[j].classList.toggle("on",j===k)})}
var d=t.closest(".dots i");if(d)go([].indexOf.call(dt.children,d));
var o=t.closest(".q button");if(o){var q=o.closest(".q");if(q.dataset.d)return;q.dataset.d=1;var cr=Q[+q.dataset.q][2],i=+o.dataset.i;q.querySelectorAll("button")[cr].classList.add("ok");if(i===cr)score++;else o.classList.add("bad");done++;
if(done===Q.length)document.getElementById("sc").textContent="Результат: "+score+" из "+Q.length+(score===Q.length?". Отлично, вы готовы!":". Пересмотрите слайды, где ошиблись.")}});
document.addEventListener("input",function(e){if(e.target.id==="inc"||e.target.id==="exp")calc();
if(e.target.type==="checkbox"){var a=document.querySelectorAll("#cks input"),k=[].filter.call(a,function(x){return x.checked}).length;document.getElementById("pgi").style.width=k/a.length*100+"%";document.getElementById("pgt").textContent="Выполнено: "+k+" из "+a.length+(k===a.length?". Вы готовы к первому году!":"")}});
document.getElementById("prev").onclick=function(){go(c-1)};document.getElementById("next").onclick=function(){go(c+1)};
document.addEventListener("keydown",function(e){if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight"||e.key==="PageDown")go(c+1);else if(e.key==="ArrowLeft"||e.key==="PageUp")go(c-1)});
var x0=null;st.addEventListener("touchstart",function(e){x0=e.touches[0].clientX},{passive:true});
st.addEventListener("touchend",function(e){if(x0===null)return;var d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>70)go(d<0?c+1:c-1);x0=null});
calc();go(0);
</script>
</body>
</html>
